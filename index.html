<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b35">
  <meta name="description" content="A reusable, slide-based reading circle discussion guide for English teachers.">
  <title>Reading Circle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Reading Circle home">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>READING <span class="brand-light">CIRCLE</span></span>
      </a>
      <div class="session-label" id="session-label">Discussion session</div>
      <button class="icon-button" id="fullscreen-button" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
    </header>

    <main id="presentation" aria-live="polite" aria-atomic="true">
      <div class="loading-state" id="loading-state">Preparing your discussion…</div>
      <div class="error-state" id="error-state" hidden>
        <h1>We couldn't load the session</h1>
        <p>Check that <code>data.json</code> is next to this page, then open the project through a local web server.</p>
      </div>
      <section class="slide" id="slide" aria-label="Presentation slide" hidden>
        <div class="slide-content" id="slide-content"></div>
      </section>
    </main>

    <footer class="controls" aria-label="Presentation controls">
      <button class="nav-button" id="previous-button" type="button" aria-label="Previous slide">← <span>Previous</span></button>
      <div class="progress-group">
        <span class="slide-count" id="slide-count" aria-live="polite">— / —</span>
        <div class="progress-track" role="progressbar" id="progress-track" aria-label="Presentation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="progress-fill" id="progress-fill"></span>
        </div>
      </div>
      <button class="nav-button" id="notes-button" type="button" aria-pressed="false">Presenter notes</button>
      <button class="nav-button print-button" id="print-button" type="button" title="Print or save as PDF">Print</button>
      <button class="nav-button next-button" id="next-button" type="button" aria-label="Next slide"><span>Next</span> →</button>
    </footer>
    <div class="keyboard-hint" aria-hidden="true">Navigate with ← → · Press N for notes · F for fullscreen</div>
  </div>
  <noscript>This presentation needs JavaScript enabled to load the editable session data.</noscript>
</body>
</html>
